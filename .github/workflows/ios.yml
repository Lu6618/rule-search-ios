name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild -project RuleSearch.xcodeproj \
            -scheme RuleSearch \
            -configuration Release \
            -archivePath build/RuleSearch.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/RuleSearch.xcarchive/Products/Applications/RuleSearch.app Payload/
          zip -r RuleSearch-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuleSearch-unsigned
          path: RuleSearch-unsigned.ipa
          if-no-files-found: error
